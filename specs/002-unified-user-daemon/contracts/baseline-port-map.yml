status_contract:
  storage: current-status-only
  monotonic_across_manifest_revisions: true
  validation: cumulative-stage-predicates
  evidence_field: evidence
  current_status_must_satisfy_all_prior_applicable_gates: true
  scalar_status_history_required: false
  stage_gates:
    inventory-required:
      required_nonempty_fields: [id, product, baseline_paths, invariant, new_owner, acceptance_cells]
    inventoried:
      required_nonempty_fields: [old_symbols, old_tests, deletion_paths]
    transplanted:
      required_nonempty_fields: [replacement_tests, evidence]
    shared:
      required_nonempty_fields: [new_symbols, replacement_tests, evidence]
    daemon-backed:
      required_nonempty_fields: [new_symbols, replacement_tests, evidence]
    installed-green:
      required_nonempty_fields: [evidence]
    removable:
      required_nonempty_fields: [deletion_paths, evidence]
    removed:
      required_nonempty_fields: [evidence]
traceability_gate:
  require_acceptance_manifest_references: true
  require_complete_acceptance_union: true
implementation_gate:
  scope: targeted_entries
  minimum_status: transplanted
  required_nonempty_fields: [old_symbols, old_tests, invariant, new_owner, replacement_tests, acceptance_cells]
deletion_gate:
  minimum_status: removable
  required_nonempty_fields: [old_symbols, old_tests, new_symbols, replacement_tests, acceptance_cells, evidence]
