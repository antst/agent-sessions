schema_version: 1
baseline_commit: c056fbc5015d4ab0a673f66cac5404206f7bcee6
assertion_source: docs/ACCEPTANCE-MATRIX.md
expected_cell_count: 202
cell_expansion_contract:
  required_family_fields: [id, evidence_tiers, platforms, assertion_source, prerequisites, ids]
  required_expanded_fields: [id, family, evidence_tiers, platforms, assertion_source, prerequisites]
  evidence_tiers:
    allowed: [S, I, T, L, X, F, U]
    require_nonempty: true
  assertion_locator:
    document: docs/ACCEPTANCE-MATRIX.md
    section_field: section
    locator_template_field: locator_template
    require_exactly_one_cell_id_in_section: true
  platform_scope:
    allowed: [linux, macos]
    require_nonempty_after_overrides: true
    applicability_field: applicability
  prerequisite_graph:
    references: acceptance-cell-ids-only
    acyclic: true
    no_implicit_dependencies: true
    missing_prerequisite_result: invalid
    failed_prerequisite_verdict: NOT_EXECUTED_PREREQUISITE_RED
topology_delta_contract:
  default: assertion-unchanged
  allowed_scope: agent-sessions-process-service-or-package-observation-only
  required_fields: [baseline_observation, target_observation, preserved_invariant]
  require_known_cell_id: true
  require_target_assertion_locator: true
  functional_or_native_product_behavior_change: forbidden
verdicts:
  - PASS
  - N/A
  - BLOCKED
  - RED
  - NOT_EXECUTED_PREREQUISITE_RED
result_contract:
  required_fields:
    - result_id
    - cell_id
    - verdict
    - source_commit
    - source_tree
    - installed_release_identity
    - os
    - architecture
    - native_product_versions
    - evidence_paths
  conditional_fields:
    PASS: [literal_command, cwd, exit_status, exact_identity_evidence, preserved_state_evidence, cleanup_evidence]
    N/A: [verdict_reason, applicability_evidence]
    BLOCKED: [verdict_reason, diagnostic_classification, applicability_evidence]
    RED: [verdict_reason, diagnostic_classification, literal_command, cwd, exit_status, exact_identity_evidence, preserved_state_evidence, cleanup_evidence]
    NOT_EXECUTED_PREREQUISITE_RED: [verdict_reason, failed_prerequisite_ids]
    superseding_rerun: [supersedes_result_id]
  aggregate_credit: forbidden
  duplicate_credit: forbidden
  supersession:
    allowed: true
    prior_result_receives_credit: false
    require_same_cell_candidate_and_platform: true
topology_deltas:
  S-06:
    baseline_observation: repository and install plans contain no obsolete canonical-host or binary names
    target_observation: active production, build, package, standard lifecycle, help, plugin, and executable dependency surfaces contain no obsolete canonical-host or binary names while historical evidence, tests, and the repository-only one-time cleanup script plus its authoritative allowlist contract may name them
    preserved_invariant: no obsolete Agent Sessions authority or binary remains reachable from a supported build, package, installation, update, removal, service, or runtime path
  U-03:
    baseline_observation: upgrade waits for Codex App Server and managed Grok peers to stop
    target_observation: first greenfield install assumes operator quiescence; unified upgrades restart only the Agent Sessions daemon and preserve vendor peers
    preserved_invariant: upgrade never creates mixed Agent Sessions authority or signals unrelated processes
  U-04:
    baseline_observation: install preserves an unrelated standalone federator or peer
    target_observation: install preserves another OS user's Agent Sessions service, the central hub, and unrelated vendor peers
    preserved_invariant: install mutates only the exact selected user service and release
  U-12:
    baseline_observation: prebuilt archive installs eleven Agent Sessions binaries
    target_observation: prebuilt archive contains exactly agent-sessions and agent-sessions-hub images and independent host-only and hub-only targets select their role
    preserved_invariant: prebuilt no-Go installation, four host product payloads, and reproducible bytes
  C-09:
    baseline_observation: normal quit converges the per-session shim count to zero
    target_observation: normal quit converges the managed attachment to detached with no per-session Agent Sessions process
    preserved_invariant: normal quit does not archive and leaves no Agent Sessions-owned residue
  C-16:
    baseline_observation: supervisor restart participates in Codex recovery
    target_observation: unified daemon restart participates in Codex recovery
    preserved_invariant: every exit, interrupt, restart, and App Server recovery path converges exactly once
  CL-02:
    baseline_observation: Claude rows coexist with one standalone host-agent service row
    target_observation: Claude rows coexist with one unified daemon service row
    preserved_invariant: ordinary, peer, and lane Claude identities coexist without duplication
  CL-05:
    baseline_observation: native title and status refresh the host-agent registration
    target_observation: native title and status refresh the daemon-owned attachment registration
    preserved_invariant: native state wins over cwd fallback without duplicating the service row
  CL-06:
    baseline_observation: host-agent restart causes idle supershims to re-register
    target_observation: daemon restart reattests idle Claude attachments without restarting Claude
    preserved_invariant: one service row and every live native Claude identity are restored
  CL-07:
    baseline_observation: supershim crash and stale native artifacts retire exact Claude ownership
    target_observation: connector or daemon-side attachment failure and stale native artifacts retire exact Claude ownership
    preserved_invariant: cleanup preserves unrelated Claude rows, processes, and service state
  CL-10:
    baseline_observation: gated launch journal survives standalone agent restart
    target_observation: gated launch journal survives unified daemon restart
    preserved_invariant: failed selection never adopts or mutates the ordinary Claude session
  G-06:
    baseline_observation: TUI, product host, private leader, observer, and MCP share one launch record
    target_observation: TUI, daemon attachment, private leader, observer, and MCP share one launch record
    preserved_invariant: every Grok actor is bound by exact ancestry and launch identity
  G-16:
    baseline_observation: standalone product-host process group is isolated from the TUI
    target_observation: private leader and observer process scopes are isolated from the TUI and daemon
    preserved_invariant: normal exit terminates only exact owned Grok helpers and removes exact owned artifacts
  G-18:
    baseline_observation: owner, standalone host, or leader death reconciles Grok state
    target_observation: owner, unified daemon, or leader death reconciles Grok state
    preserved_invariant: fault cleanup never kills unrelated Grok clients
  Q-08:
    baseline_observation: standalone agent restart republishes Qwen
    target_observation: unified daemon restart republishes Qwen
    preserved_invariant: the same native Qwen peer returns without restart or duplication
  L-16:
    baseline_observation: worker, manager, or supervisor crash restores lane state
    target_observation: worker or unified daemon crash restores lane state
    preserved_invariant: terminal items, cursor, notices, and cleanup restore exactly once
  L-25:
    baseline_observation: macOS restricted-shell cleanup is exercised after manager SIGKILL
    target_observation: macOS restricted-shell cleanup is exercised across daemon SIGKILL and restart
    preserved_invariant: exact Grok lane workers and descendants are removed without heuristic collateral
  L-29:
    baseline_observation: Qwen manager, worker, helper, agent, or supervisor failure is reconciled
    target_observation: Qwen worker, tool root, helper, or unified daemon failure is reconciled
    preserved_invariant: retry preserves unrelated processes and converges durable cleanup debt
  X-01:
    baseline_observation: local startup publishes one standalone host service row
    target_observation: local startup publishes one unified daemon host service row
    preserved_invariant: grouped local collaboration works without a hub
  X-05:
    baseline_observation: hub and standalone host-agent restart restore registrations
    target_observation: hub and host-daemon restart restore registrations
    preserved_invariant: service and peer identities return without duplicate or peer restart
  X-08:
    baseline_observation: install and tests preserve unrelated standalone host agents and hubs
    target_observation: install and tests preserve another OS user's Agent Sessions service and the central hub
    preserved_invariant: test and install scope never mutates unrelated authorities
