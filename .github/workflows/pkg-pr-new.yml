name: Publish package preview

on:
  push:
    branches:
      - "impl/*"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx pkg-pr-new publish ./bus
