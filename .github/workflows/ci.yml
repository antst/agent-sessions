name: ci

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.25.0'
  GOLANGCI_LINT_VERSION: 'v2.12.2'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test plugin, native runtime, and federation
        run: ./scripts/test

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Race test plugin, native runtime, and federation
        run: make test-race

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: linux-x64
          - goos: linux
            goarch: arm64
            platform: linux-arm64
          - goos: darwin
            goarch: amd64
            platform: darwin-x64
          - goos: darwin
            goarch: arm64
            platform: darwin-arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build and package native binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          case "$RELEASE_REF" in
            refs/tags/*) ;;
            *) RELEASE_VERSION="$(printf '%.12s' "$RELEASE_SHA")" ;;
          esac
          mkdir -p "bin/${{ matrix.platform }}"
          for binary in agent-session-runtime peer codex-peer claude-peer codex-peer-lane claude-peer-lane grok-peer grok-peer-lane; do
            go build -trimpath -ldflags='-s -w' \
              -o "bin/${{ matrix.platform }}/$binary" "./cmd/$binary"
          done
          go build -trimpath -ldflags="-s -w -X main.version=$RELEASE_VERSION" \
            -o "bin/${{ matrix.platform }}/peer-federator" ./cmd/peer-federator
          ./scripts/package-release \
            "${{ matrix.platform }}" "$RELEASE_VERSION" \
            "bin/${{ matrix.platform }}" dist/release
      - name: Upload platform archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: agent-sessions-${{ matrix.platform }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [lint, test, race, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          manifest_version="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
            .codex-plugin/plugin.json | head -1)"
          tag_version="${RELEASE_TAG#v}"
          if [ "${manifest_version%%+*}" != "$tag_version" ]; then
            printf 'tag %s does not match manifest version %s\n' "$RELEASE_TAG" "$manifest_version" >&2
            exit 1
          fi
      - name: Download platform archives
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: agent-sessions-*
          path: dist/release
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist/release
          sha256sum agent-sessions-*.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/release/* \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes $'Precompiled Agent Sessions binaries for Linux and macOS on x86-64 and arm64.\n\nVerify the selected archive against SHA256SUMS before installing.'
