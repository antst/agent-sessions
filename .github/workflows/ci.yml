name: ci

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Run the exact-commit Linux release evidence gate
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  GO_VERSION: '1.25.0'
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  ACTIONLINT_VERSION: 'v1.7.7'

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: release
        name: Load authoritative release inventory
        run: |
          printf 'matrix=%s\n' "$(./scripts/release-inventory matrix-json)" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$(cat deploy/agent-sessions/VERSION)" >> "$GITHUB_OUTPUT"

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - name: Install actionlint
        if: runner.os == 'Linux'
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - name: Lint
        run: make lint
      - name: Lint GitHub Actions workflow
        if: runner.os == 'Linux'
        run: actionlint .github/workflows/ci.yml

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: deploy/agent-sessions/NODE_VERSION
      - name: Test plugin, native runtime, and federation
        run: ./scripts/test

  race:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: deploy/agent-sessions/NODE_VERSION
      - name: Race test plugin, native runtime, and federation
        run: make test-race

  vet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Vet all packages
        run: go vet ./...

  build:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build and package native binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          RELEASE_OUTPUT_DIR: dist/release
        run: |
          make build-release-platform \
            GOOS="$GOOS" GOARCH="$GOARCH" \
            RELEASE_VERSION="${{ needs.inventory.outputs.version }}" \
            RELEASE_OUTPUT_DIR="$RELEASE_OUTPUT_DIR"
      - name: Upload platform archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-sessions-${{ matrix.platform }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  publish-preview:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: deploy/agent-sessions/NODE_VERSION
      - name: Pack publishable packages
        env:
          PACKAGE_OUTPUT_DIR: dist/packages
        run: make pack-packages
      - name: Publish package previews
        run: |
          package_paths=()
          while IFS='|' read -r package_path _; do package_paths+=("$package_path"); done \
            < <(./scripts/release-inventory packages)
          npx --yes pkg-pr-new publish "${package_paths[@]}"

  release-linux:
    name: release-linux
    if: github.event_name == 'workflow_dispatch' && inputs.release_candidate && github.ref == 'refs/heads/main'
    needs: [inventory, lint, test, race, vet, build]
    runs-on: [self-hosted, linux, agent-sessions-release]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run exact Linux release gate
        run: ./scripts/release-final-gate linux dist/gates
      - name: Build Linux gate manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          job_url="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "release-linux") | .html_url' | tail -1)"
          ./scripts/release-gate-manifest --os linux --job-url "$job_url" \
            --evidence-dir dist/gates --output dist/gates/linux.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-linux-${{ github.sha }}
          path: dist/gates
          if-no-files-found: error
          retention-days: 90

  release-macos:
    name: release-macos
    if: github.event_name == 'workflow_dispatch' && inputs.release_candidate && github.ref == 'refs/heads/main'
    needs: [inventory, lint, test, race, vet, build]
    runs-on: [self-hosted, macos, agent-sessions-release]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run exact macOS release gate
        run: ./scripts/release-final-gate macos dist/gates
      - name: Build macOS gate manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          job_url="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "release-macos") | .html_url' | tail -1)"
          ./scripts/release-gate-manifest --os macos --job-url "$job_url" \
            --evidence-dir dist/gates --output dist/gates/macos.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gate-macos-${{ github.sha }}
          path: dist/gates
          if-no-files-found: error
          retention-days: 90

  candidate-evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.release_candidate && github.ref == 'refs/heads/main'
    needs: [inventory, release-linux, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: deploy/agent-sessions/NODE_VERSION
      - name: Require signed release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
        run: ./scripts/release-commit-verify "$GITHUB_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-sessions-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-gate-linux-${{ github.sha }}
          path: dist/gates
      - name: Pack immutable npm package artifacts
        env:
          PACKAGE_OUTPUT_DIR: dist/packages
        run: make pack-packages
      - name: Generate and validate immutable release evidence
        run: |
          make build GOOS=linux GOARCH=amd64
          ./scripts/release-inventory package-inventory-json > dist/package-inventory.json
          ./scripts/release-inventory platforms > dist/platforms.txt
          mkdir -p dist/evidence
          tree_sha="$(git rev-parse HEAD^{tree})"
          go run ./scripts/releasetool evidence generate \
            --schema specs/002-unified-user-daemon/contracts/release-evidence.schema.json \
            --inventory dist/package-inventory.json --platforms dist/platforms.txt \
            --archive-dir dist/release --package-dir dist/packages --gate-dir dist/gates \
            --linux-gate dist/gates/linux.json \
            --output "dist/evidence/agent-sessions-v${{ needs.inventory.outputs.version }}-release-evidence.json" \
            --version "${{ needs.inventory.outputs.version }}" --commit "$GITHUB_SHA" --tree "$tree_sha" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-sessions-v${{ needs.inventory.outputs.version }}-release-evidence-${{ github.sha }}
          path: |
            dist/evidence/agent-sessions-v${{ needs.inventory.outputs.version }}-release-evidence.json
            dist/gates/*.txt
            dist/packages/*.tgz
          if-no-files-found: error
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [inventory, lint, test, race, vet, build]
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: deploy/agent-sessions/NODE_VERSION
      - id: tag
        name: Require exact signed evidence-bound tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
        run: |
          ./scripts/release-commit-verify "$GITHUB_SHA"
          test -n "$RELEASE_ALLOWED_SIGNERS"
          printf '%s\n' "$RELEASE_ALLOWED_SIGNERS" > "$RUNNER_TEMP/release-allowed-signers"
          chmod 0600 "$RUNNER_TEMP/release-allowed-signers"
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/release-allowed-signers"
          ./scripts/release-tag-verify "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Download exact candidate platform archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/release
          while IFS='|' read -r _ _ platform; do
            gh run download "${{ steps.tag.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" \
              --name "agent-sessions-$platform" --dir dist/release
          done < <(./scripts/release-inventory platforms)
      - name: Download exact candidate evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/candidate
          gh run download "${{ steps.tag.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" \
            --name "${{ steps.tag.outputs.artifact }}" --dir dist/candidate
      - name: Rebuild trust and verify unchanged evidence
        run: |
          evidence="dist/candidate/evidence/agent-sessions-v${{ needs.inventory.outputs.version }}-release-evidence.json"
          test "$(sha256sum "$evidence" | cut -d' ' -f1)" = "${{ steps.tag.outputs.sha256 }}"
          make build GOOS=linux GOARCH=amd64
          go run ./scripts/releasetool evidence validate \
            --schema specs/002-unified-user-daemon/contracts/release-evidence.schema.json \
            --document "$evidence" --archive-dir dist/release --package-dir dist/candidate/packages \
            --gate-dir dist/candidate/gates \
            --commit "$GITHUB_SHA" --tree "$(git rev-parse HEAD^{tree})" \
            --run-id "${{ steps.tag.outputs.run_id }}"
      - name: Refuse release and asset collisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("agent-sessions-v${{ needs.inventory.outputs.version }}-release-evidence.json" SHA256SUMS)
          while IFS='|' read -r _ _ platform; do
            assets+=("agent-sessions-${{ needs.inventory.outputs.version }}-$platform.tar.gz")
          done < <(./scripts/release-inventory platforms)
          while IFS='|' read -r _ package_name; do
            archive_name="${package_name#@}"
            assets+=("${archive_name//\//-}-${{ needs.inventory.outputs.version }}.tgz")
          done < <(./scripts/release-inventory packages)
          ./scripts/release-publication-preflight "$GITHUB_REF_NAME" "${assets[@]}"
      - name: Publish exact candidate npm packages
        run: |
          node -e '
          const [major, minor] = process.argv[1].split(".").map(Number);
          if (major < 11 || (major === 11 && minor < 5)) throw new Error(`npm 11.5.1 or newer is required; found ${process.argv[1]}`);
          ' "$(npm --version)"
          version="${{ needs.inventory.outputs.version }}"
          queued_archives=()
          while IFS='|' read -r _ package_name; do
            archive_name="${package_name#@}"
            archive="dist/candidate/packages/${archive_name//\//-}-$version.tgz"
            packed_manifest="$(tar -xOf "$archive" package/package.json)"
            node - "$packed_manifest" "$package_name" "$version" <<'NODE'
          const [encoded, name, version] = process.argv.slice(2);
          const manifest = JSON.parse(encoded);
          if (manifest.name !== name || manifest.version !== version) {
            throw new Error(`candidate package ${manifest.name}@${manifest.version} does not match ${name}@${version}`);
          }
          NODE
            view_error="$RUNNER_TEMP/npm-view-error"
            local_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
            if remote_integrity="$(npm view "$package_name@$version" dist.integrity 2>"$view_error")"; then
              if [ "$remote_integrity" != "$local_integrity" ]; then
                printf 'npm package %s@%s integrity mismatch: published=%s candidate=%s\n' \
                  "$package_name" "$version" "$remote_integrity" "$local_integrity" >&2
                exit 1
              fi
              printf 'npm package %s@%s already exists with exact integrity; skipping\n' "$package_name" "$version"
            elif grep -Fq 'E404' "$view_error"; then
              queued_archives+=("$archive")
            else
              sed -n '1,80p' "$view_error" >&2
              exit 1
            fi
          done < <(./scripts/release-inventory packages)
          for archive in "${queued_archives[@]}"; do
            npm publish "$archive" --provenance --access public
          done
      - name: Generate complete checksums
        run: |
          cp "dist/candidate/evidence/agent-sessions-v${{ needs.inventory.outputs.version }}-release-evidence.json" dist/release/
          cp dist/candidate/packages/*.tgz dist/release/
          cd dist/release
          sha256sum agent-sessions-*.tar.gz agent-sessions-*.tgz agent-sessions-v*-release-evidence.json > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/release/* \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes $'Precompiled Agent Sessions binaries for Linux and macOS on x86-64 and arm64.\n\nmacOS is not validated in 0.4.0; compatibility is restored in 0.4.1.\n\nVerify the selected archive against SHA256SUMS before installing.'
